version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: 3tier-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: crud_app
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: 3tier-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: crud_app
      DB_SSL: "false"
      JWT_SECRET: devopsShackSuperSecretKey
      ADMIN_NAME: "Admin User"
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "admin123"
      ADMIN_ROLE: "admin"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      app-network:
        aliases:
          - backend-svc

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: 3tier-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network:
    driver: bridge
