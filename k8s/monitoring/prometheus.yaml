apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-sa
  namespace: devops-project
  labels:
    app: prometheus
    tier: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-cr
  labels:
    app: prometheus
    tier: monitoring
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - extensions
      - networking.k8s.io
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-crb
  labels:
    app: prometheus
    tier: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-cr
subjects:
  - kind: ServiceAccount
    name: prometheus-sa
    namespace: devops-project
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: devops-project
  labels:
    app: prometheus
    tier: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alert_rules.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager-svc.devops-project.svc.cluster.local:9093']

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'devops-api'
        metrics_path: '/metrics'
        scrape_interval: 5s
        static_configs:
          - targets: ['api-svc.devops-project.svc.cluster.local:5000']
            labels:
              environment: 'k8s-cluster'
              service: 'backend-api'

      - job_name: 'devops-api-live'
        metrics_path: '/metrics'
        scheme: 'https'
        scrape_interval: 5s
        static_configs:
          - targets: ['3-tier-devops-project-production.up.railway.app:443']
            labels:
              environment: 'live-production'
              service: 'railway-backend-api'

      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - devops-project
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: devops-project
  labels:
    app: prometheus
    tier: monitoring
data:
  alert_rules.yml: |
    groups:
      - name: devops_api_alerts
        rules:
          - alert: LiveApiDown
            expr: up{job="devops-api-live"} == 0
            for: 1m
            labels:
              severity: critical
              service: live-production-api
            annotations:
              summary: "Live Railway Production API is DOWN"
              description: "Production API instance at https://3-tier-devops-project-production.up.railway.app has been unreachable for more than 1 minute."

          - alert: InternalApiDown
            expr: up{job="devops-api"} == 0
            for: 1m
            labels:
              severity: critical
              service: backend-api
            annotations:
              summary: "Internal DevOps API is DOWN"
              description: "Internal cluster backend API ({{ $labels.instance }}) has been unreachable for more than 1 minute."

          - alert: HighHttp5xxErrorRate
            expr: (sum(rate(http_requests_total{code=~"5.."}[5m])) by (job) / sum(rate(http_requests_total[5m])) by (job)) * 100 > 5
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Elevated HTTP 5xx error rate detected"
              description: "HTTP 5xx error rate is above 5% on {{ $labels.job }} ({{ $labels.instance }}) over the last 5 minutes."

          - alert: HighHttpLatencyP95
            expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job)) > 1.0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High P95 HTTP Request Latency (> 1s)"
              description: "95th percentile response latency has exceeded 1000ms on {{ $labels.job }} for 2 minutes."

          - alert: HighMemoryUsage
            expr: devops_api_process_resident_memory_bytes > 500000000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High Process Memory Usage (> 500MB)"
              description: "API resident memory consumption has exceeded 500MB on {{ $labels.instance }} for 5 minutes."

          - alert: HighCpuUsage
            expr: rate(devops_api_process_cpu_seconds_total[2m]) > 0.8
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: "High CPU Usage on DevOps API"
              description: "CPU utilization has sustained above 80% on {{ $labels.instance }} for 3 minutes."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: devops-project
  labels:
    app: prometheus
    tier: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        tier: monitoring
    spec:
      serviceAccountName: prometheus-sa
      containers:
        - name: prometheus
          image: prom/prometheus:v2.50.0
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.console.libraries=/etc/prometheus/console_libraries'
            - '--web.console.templates=/etc/prometheus/consoles'
            - '--web.enable-lifecycle'
          ports:
            - containerPort: 9090
              name: web
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: rules-volume
              mountPath: /etc/prometheus/alert_rules.yml
              subPath: alert_rules.yml
            - name: storage-volume
              mountPath: /prometheus
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
        - name: rules-volume
          configMap:
            name: prometheus-rules
        - name: storage-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-svc
  namespace: devops-project
  labels:
    app: prometheus
    tier: monitoring
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      name: web
  selector:
    app: prometheus
