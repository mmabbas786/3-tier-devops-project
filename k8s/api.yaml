apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: devops-project
data:
  PORT: "5000"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_NAME: "crud_app"
  DB_SSL: "false"
  ADMIN_NAME: "Admin User"
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_ROLE: "admin"
---
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: devops-project
type: Opaque
stringData:
  DB_USER: "root"
  DB_PASSWORD: "rootpassword"
  JWT_SECRET: "mirzaDevopsSuperSecretKey"
  ADMIN_PASSWORD: "admin123"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: devops-project
  labels:
    app: api
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: devops-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: devops-project
  labels:
    app: api
    tier: backend
spec:
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  selector:
    app: api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: devops-project
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
