global:
  resolve_timeout: 5m
  # Slack webhook URL (Optional: replace with your incoming webhook URL)
  # slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 3h
  receiver: 'default-webhook'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    - match:
        severity: warning
      receiver: 'warning-alerts'

receivers:
  - name: 'default-webhook'
    webhook_configs:
      - url: 'http://localhost:5001/alerts'
        send_resolved: true

  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://localhost:5001/alerts/critical'
        send_resolved: true
    # Uncomment to enable Slack notifications for critical alerts:
    # slack_configs:
    #   - channel: '#devops-critical-alerts'
    #     send_resolved: true
    #     icon_emoji: ':fire:'
    #     title: '🚨 [CRITICAL] {{ .GroupLabels.alertname }} - {{ .CommonLabels.service }}'
    #     text: >-
    #       {{ range .Alerts }}
    #         *Alert:* {{ .Annotations.summary }}
    #         *Description:* {{ .Annotations.description }}
    #         *Severity:* `{{ .Labels.severity }}`
    #         *Started:* {{ .StartsAt.Format "2006-01-02 15:04:05" }}
    #       {{ end }}

  - name: 'warning-alerts'
    webhook_configs:
      - url: 'http://localhost:5001/alerts/warning'
        send_resolved: true
    # Uncomment to enable Slack notifications for warning alerts:
    # slack_configs:
    #   - channel: '#devops-monitoring'
    #     send_resolved: true
    #     icon_emoji: ':warning:'
    #     title: '⚠️ [WARNING] {{ .GroupLabels.alertname }}'
    #     text: >-
    #       {{ range .Alerts }}
    #         *Summary:* {{ .Annotations.summary }}
    #         *Details:* {{ .Annotations.description }}
    #       {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
