global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'devops-api'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['api:5000']
        labels:
          environment: 'local'
          service: 'backend-api'

  - job_name: 'devops-api-live'
    metrics_path: '/metrics'
    scheme: 'https'
    scrape_interval: 5s
    static_configs:
      - targets: ['3-tier-devops-project-production.up.railway.app:443']
        labels:
          environment: 'live-production'
          service: 'railway-backend-api'
